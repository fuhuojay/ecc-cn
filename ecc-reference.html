<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC 快捷命令参考手册</title>
<style>
:root{--bg:#0f1419;--surface:#1a1f2e;--surface2:#242b3d;--border:#2d3548;--text:#e8ecf1;--text2:#8892a4;--accent:#4dabf7;--green:#51cf66;--orange:#ff922b;--red:#ff6b6b;--purple:#b197fc;--cyan:#22b8cf;--pink:#f06595}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
::selection{background:var(--accent);color:#fff}

.header{background:linear-gradient(135deg,#1a1f2e 0%,#0f1419 100%);border-bottom:1px solid var(--border);padding:2.5rem 1rem;text-align:center}
.header h1{font-size:2rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem}
.header p{color:var(--text2);font-size:.95rem}
.stats{display:flex;justify-content:center;gap:1.5rem;margin-top:1.2rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.6rem 1.4rem;text-align:center}
.stat .n{font-size:1.6rem;font-weight:800;color:var(--accent)}
.stat .l{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px}

.container{max-width:1100px;margin:0 auto;padding:1rem}

.search-bar{position:sticky;top:0;z-index:100;background:var(--bg);padding:.8rem 0;border-bottom:1px solid var(--border)}
.search-bar input{width:100%;padding:.75rem 1.2rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text2)}

.tabs{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.tab{padding:.45rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--text2);transition:all .2s;user-select:none}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

.info-bar{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;color:var(--text2);font-size:.8rem}
.info-bar .cnt{color:var(--accent);font-weight:700}

/* Category section */
.cat-section{margin-top:1.5rem}
.cat-title{font-size:1.15rem;font-weight:700;color:var(--text);padding:.8rem 0;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:.6rem;cursor:pointer;user-select:none}
.cat-title .icon{font-size:1.1rem}
.cat-title .badge{font-size:.7rem;background:var(--accent);color:#fff;padding:.15rem .55rem;border-radius:12px;font-weight:600}

/* Command item */
.cmd{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:.6rem;overflow:hidden;transition:border .2s}
.cmd:hover{border-color:var(--accent)}
.cmd-head{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;cursor:pointer;user-select:none}
.cmd-name{font-family:'SF Mono','Cascadia Code','Fira Code',monospace;font-weight:700;font-size:.92rem;color:var(--accent)}
.cmd-brief{font-size:.82rem;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-toggle{color:var(--text2);font-size:.8rem;transition:transform .2s}
.cmd.open .cmd-toggle{transform:rotate(90deg)}

.cmd-body{display:none;padding:0 1rem 1rem;border-top:1px solid var(--border)}
.cmd.open .cmd-body{display:block}

.cmd-body h3{font-size:.92rem;color:var(--green);margin:1rem 0 .4rem;font-weight:700}
.cmd-body h4{font-size:.85rem;color:var(--orange);margin:.8rem 0 .3rem;font-weight:600}
.cmd-body p,.cmd-body li{font-size:.85rem;color:var(--text2);line-height:1.7;margin-bottom:.3rem}
.cmd-body ul,.cmd-body ol{padding-left:1.2rem;margin-bottom:.5rem}
.cmd-body li{margin-bottom:.2rem}
.cmd-body code{background:var(--surface2);padding:.1rem .4rem;border-radius:4px;font-size:.8rem;color:var(--cyan);font-family:monospace}
.cmd-body pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;overflow-x:auto;margin:.5rem 0;font-size:.78rem;line-height:1.6;color:var(--text2);font-family:monospace}
.cmd-body table{width:100%;border-collapse:collapse;margin:.5rem 0;font-size:.8rem}
.cmd-body th,.cmd-body td{padding:.4rem .6rem;border:1px solid var(--border);text-align:left}
.cmd-body th{background:var(--surface2);color:var(--accent);font-weight:600}
.cmd-body .zh-detail{color:var(--text);font-size:.88rem;line-height:1.8;margin-bottom:.8rem}
.cmd-body .en-detail{color:var(--text2);font-size:.78rem;font-style:italic;border-left:3px solid var(--border);padding-left:.8rem;margin-top:.5rem}

.copy-btn{display:inline-block;padding:.2rem .6rem;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.7rem;color:var(--text2);cursor:pointer;margin-left:auto;transition:all .2s}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.empty{text-align:center;padding:3rem;color:var(--text2)}
.empty .icon{font-size:2.5rem;margin-bottom:.8rem}

.back-top{position:fixed;bottom:2rem;right:2rem;background:var(--accent);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .3s;font-size:1.1rem;border:none;z-index:999}
.back-top.show{opacity:1}

.kbd{display:inline-block;padding:.1rem .35rem;background:var(--surface2);border:1px solid var(--border);border-radius:3px;font-size:.68rem;font-family:monospace;color:var(--text2)}

@media(max-width:768px){.container{padding:.6rem}.cmd-brief{display:none}.header h1{font-size:1.4rem}.stats{gap:.6rem}}
</style>
</head>
<body>

<div class="header">
<h1>Everything Claude Code</h1>
<p>快捷命令 & 技能 详细中文参考手册</p>
<div class="stats">
<div class="stat"><div class="n">69</div><div class="l">命令</div></div>
<div class="stat"><div class="n">48</div><div class="l">智能体</div></div>
<div class="stat"><div class="n">182</div><div class="l">技能</div></div>
</div>
</div>

<div class="container">
<div class="search-bar">
<input type="text" id="search" placeholder="搜索命令、技能... 支持中英文  按 / 聚焦">
<div class="tabs" id="tabs">
<div class="tab active" data-tab="all">全部</div>
<div class="tab" data-tab="cmd">命令 /build 等</div>
<div class="tab" data-tab="skill">技能 Skills</div>
<div class="tab" data-tab="agent">智能体 Agents</div>
</div>
</div>

<div class="info-bar">
<span>显示 <span class="cnt" id="cnt">0</span> 项</span>
<span><span class="kbd">/</span> 搜索 &nbsp; <span class="kbd">Esc</span> 清空 &nbsp; 点击展开详情</span>
</div>

<div id="content"></div>
<div class="empty" id="empty" style="display:none"><div class="icon">&#128269;</div><p>没有匹配结果</p></div>
</div>

<button class="back-top" id="bt" onclick="scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
// ============================================================
// DATA: Each item has t(type), cat(category), n(name), brief(short zh), zh(detailed zh), en(english)
// ============================================================
const D=[

// ===== 核心命令 (Core Commands) =====
{t:"cmd",cat:"核心工作流",n:"/build",brief:"增量构建：测试→实现→验证→提交",
zh:`<h3>功能说明</h3>
<p class="zh-detail">增量式构建命令 — 从计划中选取下一个待办任务，逐步实现、测试、验证、提交。</p>
<h3>执行流程</h3>
<ol>
<li>读取任务的验收标准</li>
<li>加载相关上下文（已有代码、模式、类型）</li>
<li>先写一个会失败的测试（RED 阶段）</li>
<li>实现最小代码使测试通过（GREEN 阶段）</li>
<li>运行完整测试套件检查回归</li>
<li>运行构建验证编译</li>
<li>用描述性消息提交</li>
<li>标记任务完成，进入下一个</li>
</ol>
<h3>使用场景</h3>
<ul>
<li>按计划逐步实现功能</li>
<li>每个任务独立构建验证</li>
<li>任何步骤失败时自动触发调试流程</li>
</ul>`,
en:"Implement the next task incrementally — build, test, verify, commit"},

{t:"cmd",cat:"核心工作流",n:"/plan",brief:"将工作拆分为可验证的小任务",
zh:`<h3>功能说明</h3>
<p class="zh-detail">规划命令 — 重述需求、评估风险、创建分步实施计划。进入只读模式，不修改代码，等待用户确认后再执行。</p>
<h3>执行流程</h3>
<ol>
<li>读取现有规格（SPEC.md 或等效文件）和相关代码</li>
<li>进入计划模式 — 只读，不改代码</li>
<li>识别组件间的依赖图</li>
<li>垂直切片（每个任务一条完整路径，而非水平分层）</li>
<li>为每个任务编写验收标准和验证步骤</li>
<li>在阶段间添加检查点</li>
<li>提交计划供人工审查</li>
</ol>
<h3>任务规模参考</h3>
<table><tr><th>规模</th><th>文件数</th><th>说明</th></tr>
<tr><td>XS</td><td>1 个文件</td><td>最小任务</td></tr>
<tr><td>S</td><td>1-2 个文件</td><td>小任务</td></tr>
<tr><td>M</td><td>3-5 个文件</td><td>中等任务</td></tr>
<tr><td>L</td><td>5-8 个文件</td><td>大任务</td></tr>
<tr><td>XL</td><td>8+ 个文件</td><td>需进一步拆分</td></tr></table>
<h3>何时需要进一步拆分</h3>
<ul>
<li>超过 2 小时的 agent 工作量</li>
<li>3+ 条验收标准</li>
<li>涉及 2+ 个独立子系统</li>
<li>标题中有"和"</li>
</ul>`,
en:"Break work into small verifiable tasks with acceptance criteria and dependency ordering"},

{t:"cmd",cat:"核心工作流",n:"/review",brief:"五轴代码审查：正确性、可读性、架构、安全、性能",
zh:`<h3>功能说明</h3>
<p class="zh-detail">对当前变更（暂存区或最近提交）进行五个维度的全面代码审查。</p>
<h3>五个审查维度</h3>
<ol>
<li><strong>正确性</strong> — 是否匹配规格？边界情况是否处理？测试是否充分？</li>
<li><strong>可读性</strong> — 命名清晰？逻辑直接？组织合理？</li>
<li><strong>架构</strong> — 遵循现有模式？边界清晰？抽象层级合适？</li>
<li><strong>安全</strong> — 输入验证？密钥安全？认证检查？</li>
<li><strong>性能</strong> — 无 N+1 查询？无无界操作？</li>
</ol>
<h3>发现分类</h3>
<table><tr><th>级别</th><th>含义</th></tr>
<tr><td>严重 Critical</td><td>阻止合并</td></tr>
<tr><td>重要 Important</td><td>必须修复</td></tr>
<tr><td>建议 Suggestion</td><td>推荐改进</td></tr></table>
<h3>输出格式</h3>
<p>结构化审查报告，包含具体的 <code>file:line</code> 引用和修复建议。</p>`,
en:"Conduct a five-axis code review — correctness, readability, architecture, security, performance"},

{t:"cmd",cat:"核心工作流",n:"/test",brief:"TDD 工作流：先写失败测试，再实现",
zh:`<h3>功能说明</h3>
<p class="zh-detail">测试驱动开发命令 — 强制执行先写测试方法论。对于 bug 修复使用 Prove-It 模式。</p>
<h3>新功能流程（TDD 循环）</h3>
<ol>
<li><strong>RED</strong> — 编写描述预期行为的测试（应该失败）</li>
<li><strong>GREEN</strong> — 实现最小代码使测试通过</li>
<li><strong>REFACTOR</strong> — 在保持测试绿色的前提下重构</li>
</ol>
<h3>Bug 修复流程（Prove-It 模式）</h3>
<ol>
<li>编写复现 bug 的测试（必须失败）</li>
<li>确认测试确实失败</li>
<li>实现修复</li>
<li>确认测试通过</li>
<li>运行完整测试套件检查回归</li>
</ol>
<h3>测试金字塔</h3>
<table><tr><th>层级</th><th>占比</th><th>速度</th><th>说明</th></tr>
<tr><td>单元测试</td><td>~80%</td><td>毫秒</td><td>单进程，无 I/O</td></tr>
<tr><td>集成测试</td><td>~15%</td><td>秒级</td><td>多进程，localhost</td></tr>
<tr><td>E2E 测试</td><td>~5%</td><td>分钟级</td><td>多机器，外部服务</td></tr></table>`,
en:"Run TDD workflow — write failing tests, implement, verify. For bugs, use the Prove-It pattern."},

{t:"cmd",cat:"核心工作流",n:"/spec",brief:"规格驱动开发：先写规格再写代码",
zh:`<h3>功能说明</h3>
<p class="zh-detail">在写代码之前创建结构化规格说明。门控工作流：规格→计划→任务→实现，每个阶段必须经人工验证后才能推进。</p>
<h3>规格涵盖六个核心领域</h3>
<ol>
<li><strong>目标</strong> — 做什么、为什么、给谁、成功标准</li>
<li><strong>命令</strong> — 完整可执行命令及参数</li>
<li><strong>项目结构</strong> — 目录布局</li>
<li><strong>代码风格</strong> — 一个真实代码片段胜过三段描述</li>
<li><strong>测试策略</strong> — 框架、位置、覆盖率、测试层级</li>
<li><strong>边界</strong> — 必须做 / 先问再做 / 绝不做</li>
</ol>
<h3>使用场景</h3>
<ul>
<li>开始新项目或新功能时</li>
<li>需求不清晰或模糊时</li>
<li>需求只存在于模糊想法中时</li>
</ul>`,
en:"Start spec-driven development — write a structured specification before writing code"},

{t:"cmd",cat:"核心工作流",n:"/ship",brief:"发布前检查清单：并行扇出→合并→Go/No-Go",
zh:`<h3>功能说明</h3>
<p class="zh-detail">发布前检查编排器 — 并行运行三个专家角色审查当前变更，合并报告后做出 Go/No-Go 决策。</p>
<h3>Phase A — 并行扇出（同时启动三个子 agent）</h3>
<ol>
<li><strong>code-reviewer</strong> — 五轴审查（正确性、可读性、架构、安全、性能）</li>
<li><strong>security-auditor</strong> — 漏洞和威胁模型检查（OWASP Top 10、密钥、认证授权）</li>
<li><strong>test-engineer</strong> — 测试覆盖率分析（正常路径、边界、错误路径、并发）</li>
</ol>
<h3>Phase B — 合并</h3>
<p>聚合所有发现：代码质量、安全、性能、无障碍、基础设施、文档。</p>
<h3>Phase C — 决策和回滚</h3>
<p>输出：Ship Decision (GO | NO-GO)、阻断项、推荐修复、已知风险、回滚计划。</p>
<h3>规则</h3>
<ul>
<li>三个 Phase A 角色必须并行运行，不能串行</li>
<li>回滚计划在任何 GO 决策前都是必须的</li>
<li>任何角色返回严重发现，默认 NO-GO</li>
<li>可跳过条件：变更 ≤2 文件、diff <50 行、不涉及认证/支付/数据访问</li>
</ul>`,
en:"Run the pre-launch checklist via parallel fan-out to specialist personas, then synthesize a go/no-go decision"},

{t:"cmd",cat:"核心工作流",n:"/code-simplify",brief:"简化代码：降低复杂度，不改变行为",
zh:`<h3>功能说明</h3>
<p class="zh-detail">简化最近修改的代码（或指定范围），在完全保留行为的前提下提高清晰度和可维护性。</p>
<h3>简化机会扫描</h3>
<ul>
<li>深层嵌套 → 提取为 guard clauses 或辅助函数</li>
<li>长函数 → 按职责拆分</li>
<li>嵌套三元表达式 → 改为 if/else 或 switch</li>
<li>泛化命名 → 使用描述性名称</li>
<li>重复逻辑 → 提取为共享函数</li>
<li>死代码 → 确认后移除</li>
</ul>
<h3>五项原则</h3>
<ol>
<li><strong>精确保留行为</strong> — 相同输入、输出、副作用、错误行为</li>
<li><strong>遵循项目约定</strong> — 匹配项目风格，非外部偏好</li>
<li><strong>清晰优于巧妙</strong> — 显式代码胜过紧凑代码</li>
<li><strong>保持平衡</strong> — 避免过度简化</li>
<li><strong>聚焦变更范围</strong> — 默认只处理最近修改的代码</li>
</ol>`,
en:"Simplify code for clarity and maintainability — reduce complexity without changing behavior"},

// ===== 会话管理 =====
{t:"cmd",cat:"会话管理",n:"/save-session",brief:"保存当前会话状态，以便未来恢复",
zh:`<h3>功能说明</h3>
<p class="zh-detail">捕获会话中发生的一切 — 构建了什么、什么有效、什么失败、还剩什么 — 写入带日期的文件，下次会话可以无缝接续。</p>
<h3>使用时机</h3>
<ul>
<li>关闭 Claude Code 前的会话结束</li>
<li>即将达到上下文限制前</li>
<li>解决复杂问题后想保留记忆</li>
<li>任何需要将上下文传递给未来会话的时刻</li>
</ul>
<h3>会话文件包含</h3>
<ul>
<li><strong>我们在构建什么</strong> — 1-3 段描述目标</li>
<li><strong>什么有效（附证据）</strong> — 仅列出已确认工作的内容</li>
<li><strong>什么无效（及原因）</strong> — 最重要的部分，防止下次重蹈覆辙</li>
<li><strong>尚未尝试</strong> — 有前景但未尝试的方法</li>
<li><strong>文件状态</strong> — 每个触碰的文件及其当前状态</li>
<li><strong>已做决策</strong> — 架构选择和权衡</li>
<li><strong>阻断项和开放问题</strong> — 未解决的事项</li>
<li><strong>下一步</strong> — 恢复时最该做的一件事</li>
</ul>`,
en:"Save current session state to a dated file so work can be resumed in a future session."},

{t:"cmd",cat:"会话管理",n:"/resume-session",brief:"加载最近会话文件，从上次结束处恢复",
zh:`<h3>功能说明</h3>
<p class="zh-detail">加载最近的会话文件并以前一个会话结束时的完整上下文恢复工作。</p>
<h3>执行流程</h3>
<ol>
<li>扫描 <code>~/.claude/session-data/</code> 目录</li>
<li>找到最新的会话文件</li>
<li>读取并解析会话内容</li>
<li>向用户展示上下文摘要</li>
<li>从"下一步"指示的位置继续工作</li>
</ol>`,
en:"Load the most recent session file and resume work with full context."},

{t:"cmd",cat:"会话管理",n:"/sessions",brief:"管理会话历史、别名和元数据",
zh:`<h3>功能说明</h3>
<p class="zh-detail">管理 Claude Code 会话历史 — 列出、加载、设置别名、编辑存储在 <code>~/.claude/session-data/</code> 中的会话。</p>
<h3>子命令</h3>
<table><tr><th>命令</th><th>说明</th></tr>

en:"Run the ECC quality pipeline for a file or project scope."},

{t:"cmd",cat:"质量与审查",n:"/santa-loop",brief:"对抗性双审查收敛循环",
zh:`<h3>功能说明</h3>
<p class="zh-detail">两个独立模型审查者必须都通过才能提交代码的对抗性循环。审查者 A（Claude Opus）始终运行，审查者 B 尝试使用不同模型（GPT/Gemini）以获得真正的独立性。</p>
<h3>流程</h3>
<ol>
<li>NICE 轮次：两个审查者独立审查并评分</li>
<li>NAUGHTY 轮次：发现问题时自动修复并提交</li>
<li>收敛：两个审查者都给 NICE 评分时退出循环</li>
<li>仅在最终 NICE 后推送</li>
</ol>`,
en:"Adversarial dual-review convergence loop — two independent model reviewers must both approve."},

{t:"cmd",cat:"质量与审查",n:"/review-pr",brief:"使用专业智能体全面审查 PR",

{t:"cmd",cat:"其他",n:"/jira",brief:"Jira 工单集成",

// ===== 技能 Skills =====
{t:"skill",cat:"开发方法论",n:"spec-driven-development",brief:"规格驱动开发：先写规格再编码",
zh:`<h3>功能说明</h3>
<p class="zh-detail">门控工作流：SPECIFY → PLAN → TASKS → IMPLEMENT。每个阶段必须经人工验证后才能推进。</p>
<h3>规格六要素</h3>
<ol>
<li>目标（做什么、为什么、给谁、成功标准）</li>
<li>命令（完整可执行命令及参数）</li>
<li>项目结构（目录布局）</li>
<li>代码风格（一个真实代码片段胜过三段描述）</li>
<li>测试策略（框架、位置、覆盖率）</li>
<li>边界（必须做 / 先问再做 / 绝不做）</li>
</ol>`,
en:"Creates specs before coding. Gated workflow: SPECIFY → PLAN → TASKS → IMPLEMENT."},

{t:"skill",cat:"开发方法论",n:"test-driven-development",brief:"测试驱动开发：RED→GREEN→REFACTOR",
zh:`<h3>功能说明</h3>
<p class="zh-detail">TDD 循环：RED（写失败测试）→ GREEN（最小代码通过）→ REFACTOR（保持绿色重构）。</p>
<h3>关键规则</h3>
<ul>
<li>测试状态，不测试交互</li>
<li>DAMP 优于 DRY（测试中描述性和有意义的短语）</li>
<li>优先真实实现：real > fake > stub > mock</li>
<li>Arrange-Act-Assert 模式</li>
<li>每个概念一个断言</li>
</ul>`,
en:"Drives development with tests. TDD Cycle: RED → GREEN → REFACTOR."},

{t:"skill",cat:"开发方法论",n:"incremental-implementation",brief:"增量实现：实现→测试→验证→提交",
zh:`<h3>功能说明</h3>
<p class="zh-detail">增量循环：Implement → Test → Verify → Commit → Next slice。</p>
<h3>切片策略</h3>
<ul>
<li><strong>垂直切片（推荐）</strong>：每个切片一条贯穿技术栈的完整路径</li>
<li><strong>契约优先</strong>：先定义 API 契约，后端和前端并行</li>
<li><strong>风险优先</strong>：先攻克最危险的部分</li>
</ul>
<h3>六条规则</h3>
<ol>
<li>Rule 0: 简单优先 — "能工作的最简单方案是什么？"</li>
<li>Rule 0.5: 范围纪律 — 只碰任务需要的</li>
<li>Rule 1: 一次一件事</li>
<li>Rule 2: 保持可编译</li>
<li>Rule 3: 未完成功能用 Feature Flag</li>
<li>Rule 4: 安全默认值</li>
<li>Rule 5: 可回滚</li>
</ol>`,
en:"Delivers changes incrementally. The Increment Cycle: Implement → Test → Verify → Commit."},

{t:"skill",cat:"开发方法论",n:"code-review-and-quality",brief:"多轴代码审查：五维度评估",
zh:`<h3>功能说明</h3>
<p class="zh-detail">在合并任何变更前进行五个维度的评估。</p>
<h3>变更规模</h3>
<table><tr><th>行数</th><th>评价</th></tr>
<tr><td>~100 行</td><td>良好</td></tr>
<tr><td>~300 行</td><td>可接受</td></tr>
<tr><td>~1000 行</td><td>过大，需拆分</td></tr></table>`,
en:"Conducts multi-axis code review across five dimensions."},

{t:"skill",cat:"开发方法论",n:"planning-and-task-breakdown",brief:"工作拆分：依赖图→垂直切片→任务",
zh:`<h3>功能说明</h3>
<p class="zh-detail">规划流程：进入计划模式 → 识别依赖图 → 垂直切片 → 编写任务 → 排序和检查点。</p>`,
en:"Breaks work into ordered tasks with dependency graph analysis."},

{t:"skill",cat:"安全与调试",n:"debugging-and-error-recovery",brief:"系统化根因调试",
zh:`<h3>功能说明</h3>
<p class="zh-detail">停车线规则：停止添加功能 → 保留证据 → 诊断 → 修复 → 防护 → 恢复。</p>
<h3>分诊清单</h3>
<ol>
<li>复现 — 让失败可靠发生</li>
<li>定位 — 缩小范围（UI/API/DB/构建/外部服务/测试本身）</li>
<li>精简 — 创建最小失败用例</li>
<li>修复根因 — 修复底层问题，而非症状</li>
<li>防护复发 — 编写捕获此特定失败的测试</li>
<li>端到端验证</li>
</ol>`,
en:"Guides systematic root-cause debugging. Stop-the-Line Rule."},

{t:"skill",cat:"安全与调试",n:"security-and-hardening",brief:"安全加固：三层边界系统",
zh:`<h3>功能说明</h3>
<p class="zh-detail">三层边界系统：</p>
<h3>必须做</h3>
<ul>
<li>验证所有外部输入</li>
<li>参数化 SQL</li>
<li>对 XSS 输出编码</li>
<li>HTTPS</li>
<li>密码哈希（bcrypt/scrypt/argon2）</li>
<li>安全头（CSP, HSTS）</li>
<li>发布前 npm audit</li>
</ul>
<h3>先问再做</h3>
<ul>
<li>新的认证流程</li>
<li>存储新的敏感数据</li>
<li>新的外部集成</li>
<li>CORS 变更</li>
<li>文件上传</li>
</ul>
<h3>绝不做</h3>
<ul>
<li>提交密钥</li>
<li>记录敏感数据</li>
<li>信任客户端验证</li>
<li>eval()/innerHTML + 用户数据</li>
<li>localStorage 存储认证 token</li>
</ul>`,
en:"Hardens code against vulnerabilities. Three-Tier Boundary System."},

{t:"skill",cat:"安全与调试",n:"shipping-and-launch",brief:"发布准备：检查清单+灰度发布+回滚",
zh:`<h3>功能说明</h3>
<p class="zh-detail">发布前检查清单：代码质量、安全、性能、无障碍、基础设施、文档。</p>
<h3>灰度发布序列</h3>
<p>staging → production (flag OFF) → 团队 → 金丝雀 (5%) → 逐步 → 全量</p>
<h3>回滚时间</h3>
<table><tr><th>方式</th><th>时间</th></tr>
<tr><td>Feature Flag</td><td>< 1 分钟</td></tr>
<tr><td>重新部署</td><td>< 5 分钟</td></tr>
<tr><td>数据库</td><td>< 15 分钟</td></tr></table>`,
en:"Prepares production launches with checklist, staged rollout, and rollback strategy."},

{t:"skill",cat:"安全与调试",n:"safety-guard",brief:"防止破坏性操作",
zh:`<h3>功能说明</h3>
<p class="zh-detail">在处理生产系统或自主运行 agent 时防止破坏性操作。</p>`,
en:"Prevent destructive operations when working on production systems."},

{t:"skill",cat:"代码质量",n:"code-simplification",brief:"简化代码：五项原则+逐步应用",
zh:`<h3>功能说明</h3>
<p class="zh-detail">五项原则：精确保留行为、遵循项目约定、清晰优于巧妙、保持平衡、聚焦变更范围。</p>
<h3>500 行规则</h3>
<p>如果重构涉及 500+ 行，使用自动化工具（codemods、AST 转换）。</p>`,
en:"Simplifies code for clarity. Five principles, incremental application."},

{t:"skill",cat:"代码质量",n:"api-and-interface-design",brief:"稳定的 API 和接口设计",
zh:`<h3>功能说明</h3>
<p class="zh-detail">设计稳定、文档完善的接口，难以被误用。</p>
<h3>核心原则</h3>
<ul>
<li>Hyrum 定律：所有可观察行为都会被某些人依赖</li>
<li>单版本规则：避免强迫消费者在多个版本间选择</li>
<li>契约优先：先定义接口再实现</li>
<li>一致的错误语义</li>
<li>在边界验证</li>
<li>优先扩展而非修改</li>
</ul>`,
en:"Guides stable API and interface design. Core principles including Hyrum's Law."},

{t:"skill",cat:"代码质量",n:"performance-optimization",brief:"性能优化：Core Web Vitals 目标",
zh:`<h3>功能说明</h3>
<p class="zh-detail">Core Web Vitals 目标：LCP ≤ 2.5s, INP ≤ 200ms, CLS ≤ 0.1。</p>
<h3>性能预算</h3>
<table><tr><th>指标</th><th>目标</th></tr>
<tr><td>JS 大小</td><td>< 200KB gzipped</td></tr>
<tr><td>CSS 大小</td><td>< 50KB</td></tr>
<tr><td>图片大小</td><td>< 200KB</td></tr>
<tr><td>API p95</td><td>< 200ms</td></tr>
<tr><td>TTI (4G)</td><td>< 3.5s</td></tr>
<tr><td>Lighthouse</td><td>≥ 90</td></tr></table>`,
en:"Optimizes application performance. Core Web Vitals targets and performance budgets."},

{t:"skill",cat:"代码质量",n:"deprecation-and-migration",brief:"弃用和迁移管理",
zh:`<h3>功能说明</h3>
<p class="zh-detail">代码是负债而非资产 — 每一行都有持续的维护成本。</p>
<h3>迁移模式</h3>
<ul>
<li><strong>绞杀者模式</strong>：新旧并行，逐步转移流量</li>
<li><strong>适配器模式</strong>：旧接口，新实现</li>
<li><strong>Feature Flag 迁移</strong></li>
</ul>`,
en:"Manages deprecation and migration. Strangler, Adapter, Feature Flag patterns."},

{t:"skill",cat:"Agent 与自动化",n:"autonomous-agent-harness",brief:"完全自主的 agent 系统",
zh:`<h3>功能说明</h3>
<p class="zh-detail">将 Claude Code 转变为完全自主的 agent 系统，具有持久内存、计划操作、计算机使用和任务队列。</p>`,
en:"Transform Claude Code into a fully autonomous agent system."},

{t:"skill",cat:"Agent 与自动化",n:"continuous-learning-v2",brief:"基于直觉的持续学习系统",
zh:`<h3>功能说明</h3>
<p class="zh-detail">通过钩子观察会话，创建带置信度评分的原子直觉，并进化为技能/命令/agent。</p>`,
en:"Instinct-based learning system with confidence scoring and evolution."},

{t:"skill",cat:"Agent 与自动化",n:"gan-style-harness",brief:"GAN 风格 Generator-Evaluator harness",
zh:`<h3>功能说明</h3>
<p class="zh-detail">基于 Anthropic 2026 年 3 月 harness 设计论文的 GAN 风格 agent harness。</p>`,
en:"GAN-inspired Generator-Evaluator agent harness."},

{t:"skill",cat:"Agent 与自动化",n:"claude-devfleet",brief:"多 agent 编排：并行 worktree",
zh:`<h3>功能说明</h3>
<p class="zh-detail">通过 Claude DevFleet 编排多 agent 编码任务 — 规划项目、在隔离 worktree 中派遣并行 agent。</p>`,
en:"Orchestrate multi-agent coding tasks via Claude DevFleet."},

{t:"skill",cat:"Agent 与自动化",n:"team-builder",brief:"交互式 agent 团队选择器",
zh:`<h3>功能说明</h3>
<p class="zh-detail">交互式 agent 选择器，用于组合和派遣并行团队。</p>`,
en:"Interactive agent picker for composing and dispatching parallel teams."},

{t:"skill",cat:"Agent 与自动化",n:"gateguard",brief:"事实强制门控：+2.25 分质量提升",
zh:`<h3>功能说明</h3>
<p class="zh-detail">阻止 Edit/Write/Bash 并要求具体调查后才允许操作 — 可测量地将输出质量提高 +2.25 分。</p>`,
en:"Fact-forcing gate that blocks actions until concrete investigation is provided."},

{t:"skill",cat:"上下文与内存",n:"context-engineering",brief:"优化 agent 上下文设置",
zh:`<h3>功能说明</h3>
<p class="zh-detail">上下文层级（持久性从高到低）：规则文件 → 规格/架构文档 → 相关源文件 → 错误输出/测试结果 → 对话历史。</p>
<h3>反模式</h3>
<ul>
<li>上下文饥饿</li>
<li>上下文洪水（>5000 行）</li>
<li>过时上下文</li>
<li>缺失示例</li>
<li>隐式知识</li>
<li>静默困惑</li>
</ul>`,
en:"Optimizes agent context setup. Context hierarchy and anti-patterns."},

{t:"skill",cat:"上下文与内存",n:"ck",brief:"持久化项目级内存",
zh:`<h3>功能说明</h3>
<p class="zh-detail">Claude Code 的持久化项目级内存 — 会话开始时自动加载项目上下文，跟踪有 git 活动的会话。</p>`,
en:"Persistent per-project memory for Claude Code."},

{t:"skill",cat:"上下文与内存",n:"strategic-compact",brief:"逻辑间隔手动上下文压缩",
zh:`<h3>功能说明</h3>
<p class="zh-detail">在逻辑间隔建议手动上下文压缩，通过任务阶段保留上下文而非任意自动压缩。</p>`,
en:"Suggests manual context compaction at logical intervals."},

{t:"skill",cat:"Git 与文档",n:"git-workflow-and-versioning",brief:"Git 工作流：Trunk-based 开发",
zh:`<h3>功能说明</h3>
<p class="zh-detail">推荐 Trunk-based 开发：保持 main 始终可部署，短生命周期的功能分支（1-3 天）。</p>
<h3>存档点模式</h3>
<p>实现 → 测试 → 提交（或回滚）。永远不要丢失超过一个增量。</p>`,
en:"Structures git workflow practices. Trunk-based development recommended."},

{t:"skill",cat:"Git 与文档",n:"documentation-and-adrs",brief:"架构决策记录 (ADR)",
zh:`<h3>功能说明</h3>
<p class="zh-detail">捕获重要技术决策背后的推理。存储在 <code>docs/decisions/</code> 中，顺序编号。</p>
<h3>ADR 模板</h3>
<ul>
<li>状态（PROPOSED → ACCEPTED → SUPERSEDED/DEPRECATED）</li>
<li>日期</li>
<li>上下文</li>
<li>决策</li>
<li>考虑的替代方案</li>
<li>后果</li>
</ul>`,
en:"Records architectural decisions as ADRs with context, alternatives, and rationale."},

{t:"skill",cat:"前端与 UI",n:"frontend-ui-engineering",brief:"生产级 UI：避免 AI 美学",
zh:`<h3>功能说明</h3>
<p class="zh-detail">避免 AI 美学：不要全部紫色/靛蓝、过多渐变、到处 rounded-2xl、通用 hero 区域、lorem ipsum。</p>
<h3>状态管理层级</h3>
<p>本地状态 (useState) → 提升状态 → Context → URL 状态 → 服务器状态 (React Query) → 全局 store (Zustand/Redux)</p>`,
en:"Builds production-quality UIs. Avoid the AI aesthetic."},

{t:"skill",cat:"前端与 UI",n:"frontend-patterns",brief:"React/Next.js 前端模式",
zh:`<h3>功能说明</h3>
<p class="zh-detail">React、Next.js 前端开发模式：状态管理、性能优化和 UI 最佳实践。</p>`,
en:"Frontend development patterns for React, Next.js."},

{t:"skill",cat:"前端与 UI",n:"design-system",brief:"设计系统生成与审计",
zh:`<h3>功能说明</h3>
<p class="zh-detail">生成或审计设计系统，检查视觉一致性，审查涉及样式的 PR。</p>`,
en:"Generate or audit design systems, check visual consistency."},

{t:"skill",cat:"CI/CD 与部署",n:"ci-cd-and-automation",brief:"CI/CD 管道自动化",
zh:`<h3>功能说明</h3>
<p class="zh-detail">质量门控管道：Lint → 类型检查 → 单元测试 → 构建 → 集成 → E2E → 安全审计 → 包大小。不可跳过任何门控。</p>
<h3>CI 优化（管道超 10 分钟时）</h3>
<ul>
<li>缓存依赖</li>
<li>并行运行任务</li>
<li>仅运行变更涉及的部分</li>
<li>使用矩阵构建分片测试套件</li>
</ul>`,
en:"Automates CI/CD pipeline setup with quality gates."},

{t:"skill",cat:"CI/CD 与部署",n:"deployment-patterns",brief:"部署模式：Docker、健康检查、回滚",
zh:`<h3>功能说明</h3>
<p class="zh-detail">部署工作流、CI/CD 管道模式、Docker 容器化、健康检查、回滚策略和生产就绪清单。</p>`,
en:"Deployment workflows, Docker containerization, health checks, rollback strategies."},

{t:"skill",cat:"数据库",n:"database-migrations",brief:"数据库迁移：零停机部署",
zh:`<h3>功能说明</h3>
<p class="zh-detail">数据库迁移最佳实践：模式变更、数据迁移、回滚和零停机部署。</p>`,
en:"Database migration best practices for zero-downtime deployments."},

{t:"skill",cat:"数据库",n:"postgres-patterns",brief:"PostgreSQL 模式：查询优化、索引",
zh:`<h3>功能说明</h3>
<p class="zh-detail">基于 Supabase 最佳实践的 PostgreSQL 数据库模式：查询优化、模式设计、索引和安全。</p>`,
en:"PostgreSQL database patterns based on Supabase best practices."},

{t:"skill",cat:"语言模式",n:"python-patterns",brief:"Pythonic 惯用法和最佳实践",
zh:`<h3>功能说明</h3>
<p class="zh-detail">Pythonic 惯用法、PEP 8 标准、类型提示和最佳实践。</p>`,
en:"Pythonic idioms, PEP 8 standards, type hints, and best practices."},

{t:"skill",cat:"语言模式",n:"golang-patterns",brief:"惯用 Go 模式和最佳实践",
zh:`<h3>功能说明</h3>

// ===== RENDERING =====
const contentEl=document.getElementById('content');
const emptyEl=document.getElementById('empty');
const searchEl=document.getElementById('search');
const cntEl=document.getElementById('cnt');
const tabsEl=document.getElementById('tabs');
let activeTab='all',searchText='';

function render(){
const q=searchText.toLowerCase();
const filtered=D.filter(d=>{
if(activeTab!=='all'){
if(activeTab==='cmd'&&d.t!=='cmd')return false;
if(activeTab==='skill'&&d.t!=='skill')return false;
if(activeTab==='agent'&&d.t!=='agent')return false;
}
if(q){
return d.n.toLowerCase().includes(q)||d.brief.includes(q)||d.zh.includes(q)||d.cat.includes(q);
}
return true;
});
cntEl.textContent=filtered.length;
if(!filtered.length){contentEl.innerHTML='';emptyEl.style.display='block';return}
emptyEl.style.display='none';

// Group by category
const groups={};
filtered.forEach(d=>{if(!groups[d.cat])groups[d.cat]=[];groups[d.cat].push(d)});

const catIcons={
'核心工作流':'&#9881;','会话管理':'&#128196;','PRP 工作流':'&#128196;','多模型协作':'&#129302;',
'质量与审查':'&#9989;','构建与修复':'&#128295;','C++ 命令':'&#9881;','Go 命令':'&#9881;',
'Kotlin 命令':'&#9881;','Rust 命令':'&#9881;','Python 命令':'&#9881;','Flutter 命令':'&#9881;',
'学习与进化':'&#128218;','自动化':'&#128260;','配置':'&#9881;','其他':'&#128196;',
'开发方法论':'&#128218;','安全与调试':'&#128274;','代码质量':'&#9989;','Agent 与自动化':'&#129302;',
'上下文与内存':'&#129504;','Git 与文档':'&#128196;','前端与 UI':'&#127912;',
'CI/CD 与部署':'&#128640;','数据库':'&#128451;','语言模式':'&#128187;','框架模式':'&#128736;',
'集成与工具':'&#128268;','架构与规划':'&#127959;','代码审查':'&#128065;','构建修复':'&#128295;',
'安全':'&#128274;','性能':'&#9889;','测试':'&#9989;','文档':'&#128196;',
'GAN':'&#129302;','开源':'&#128760;','自动化':'&#128260;','无障碍':'&#9855;',
'SEO':'&#127760;','通信':'&#128172;','医疗':'&#127973;','重构':'&#128260;','学习':'&#128218;'
};

let html='';
for(const[cat,items]of Object.entries(groups)){
const icon=catIcons[cat]||'&#128196;';
html+=`<div class="cat-section"><div class="cat-title"><span class="icon">${icon}</span>${cat}<span class="badge">${items.length}</span></div>`;
items.forEach(d=>{
const tLabel={cmd:'命令',skill:'技能',agent:'智能体'}[d.t];
html+=`<div class="cmd" data-t="${d.t}">
<div class="cmd-head" onclick="this.parentElement.classList.toggle('open')">
<span class="cmd-name">${d.n}</span>
<span class="cmd-brief">${d.brief}</span>
<button class="copy-btn" onclick="event.stopPropagation();copyCmd('${d.n.replace(/'/g,"\\'")}')">复制名称</button>
<span class="cmd-toggle">&#9654;</span>
</div>
<div class="cmd-body">
${d.zh}
<div class="en-detail">${d.en}</div>
</div>
</div>`;
});
html+='</div>';
}
contentEl.innerHTML=html;
}

function copyCmd(name){
navigator.clipboard.writeText(name).then(()=>{
const btns=document.querySelectorAll('.copy-btn');
btns.forEach(b=>{if(b.parentElement.querySelector('.cmd-name').textContent===name){
b.textContent='已复制!';
setTimeout(()=>b.textContent='复制名称',1500);
}});
});
}

// Tabs
tabsEl.querySelectorAll('.tab').forEach(tab=>{
tab.addEventListener('click',()=>{
tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
activeTab=tab.dataset.tab;
render();
});
});

// Search
searchEl.addEventListener('input',e=>{searchText=e.target.value;render()});

// Keyboard
document.addEventListener('keydown',e=>{
if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus()}
if(e.key==='Escape'){searchEl.value='';searchText='';searchEl.blur();render()}
});

// Back to top
window.addEventListener('scroll',()=>{
document.getElementById('bt').classList.toggle('show',scrollY>300);
});

render();
</script>
</body>
</html>
